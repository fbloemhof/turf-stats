name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: turf-stats

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/turf-stats.zip
          # Baseline release notes generated from commits/PRs since the
          # previous tag, so a release is never published with an empty
          # body even if no one hand-writes notes for it. `gh release edit
          # --notes-file` afterwards fully replaces this (doesn't append),
          # so richer hand-written notes still work the same as before.
          generate_release_notes: true
